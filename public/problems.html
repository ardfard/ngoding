<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ngoding — Linux sandbox exercises</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/problems.js"></script>
  </head>
  <body>
    <aside>
      <header>
        <h1>ngoding</h1>
        <a href="/play">Play</a>
        <span id="status" class="status">loading…</span>
      </header>
      <nav id="tabs"></nav>
      <article id="problem"></article>
      <footer>
        <button id="check" disabled>Check my output</button>
        <div id="result" role="status"></div>
        <details>
          <summary>Sandbox</summary>
          <p>
            A Debian VM running in your browser (v86, x86 emulated in WebAssembly).
            Your work is saved in this browser; only output files are sent for grading.
          </p>
          <p>Your session: <code id="seed"></code></p>
          <button id="reset" class="danger">Reset VM &amp; new inputs</button>
        </details>
        <p class="credits">
          © 2026 ardfard ·
          <a href="https://github.com/ardfard/ngoding/blob/main/LICENSE">Apache-2.0</a> ·
          <a href="https://github.com/ardfard/ngoding">Fork me on GitHub</a>
        </p>
      </footer>
    </aside>
    <div id="workspace" class="layout-split" style="--editor-share: 0.6">
      <div id="toolbar">
        <button id="layout-toggle" title="Cycle layout: split, editor only, shell only">Split</button>
        <label class="editor-only" id="lang-label">Language
          <select id="editor-lang" title="Language for all problems"></select>
        </label>
        <span id="editor-status"></span>
        <button id="vim-toggle" class="editor-only" aria-pressed="false" title="Vim keybindings (:w saves)">Vim</button>
        <button id="editor-save" class="editor-only" title="Save (Ctrl-S)" disabled>Save</button>
        <button id="editor-run" class="editor-only" title="Save, compile if needed, and run in the terminal (Ctrl-Enter)" disabled>Run ▸</button>
      </div>
      <section id="editor" class="editor-only"></section>
      <div id="split" class="editor-only" role="separator" aria-orientation="horizontal" aria-label="Resize editor and shell" tabindex="0"></div>
      <main id="terminal"></main>
    </div>
  </body>
</html>
