<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ngoding — Fork share</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/share.js"></script>
  </head>
  <body class="home">
    <div class="home-shell">
      <header class="home-top">
        <a class="home-brand" href="/" aria-label="ngoding home">ngoding<span class="home-cursor" aria-hidden="true"></span></a>
      </header>
      <main class="share-main">
        <h1 class="home-headline">Someone shared a playground with you.</h1>
        <section class="home-panel" style="max-width:420px">
          <p id="share-status" class="home-panel-blurb">Loading share…</p>
          <button type="button" id="fork-btn" class="home-btn home-btn-primary" disabled>Fork into my playground</button>
        </section>
      </main>
    </div>
  </body>
</html>
