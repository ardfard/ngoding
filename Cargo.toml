[package]
name = "ngoding"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
hmac = "0.13.0"
percent-encoding = "2.3.2"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "fs"] }
tokio-util = { version = "0.7.20", features = ["io"] }
